<!-- Mini Chat Window -->
<div class="mini-chat" *ngIf="isOpen && !isFullscreen">
  <div class="chat-header">
     <div class="logo-area">
      <div class="status-dot"></div>
      <div>
        <h5>Electregy AI</h5>
        <span class="status-text">Online</span>
      </div>
    </div>
    <button class="expand-btn" (click)="openFullscreen()">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    </button>
  </div>
  
  <div class="chat-body" #chatBodyMini>
    <div *ngFor="let msg of messages" 
         class="message-bubble" 
         [class.user]="msg.sender === 'user'" 
         [class.bot]="msg.sender === 'bot'">
      {{ msg.text }}
    </div>

    <!-- Loading Indicator for Mini Chat -->
    <div *ngIf="isBotTyping" class="message-bubble bot typing-indicator">
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="chat-footer">
     <input [(ngModel)]="userInput" 
           (keydown.enter)="send()" 
           placeholder="Type a command...">
    <button class="send-btn-mini" (click)="send()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<!-- Full Screen Chat Modal -->
<div class="fullscreen-chat-overlay" *ngIf="isFullscreen">
  <div class="fullscreen-chat-container">
    
    <div class="fs-header">
       <div class="navbar-logo">
        <div class="logo-icon-bg">
          <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="#fff"/></svg>
        </div>
        <span class="brand-name">Electre<span class="highlight">gy</span></span>
      </div>
      <button class="close-btn" (click)="closeFullscreen()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="fs-body">
      <div class="fs-main full-width" #chatBodyFull>
        <div *ngFor="let msg of messages" 
             class="message-row" 
             [class.user-row]="msg.sender === 'user'" 
             [class.bot-row]="msg.sender === 'bot'">
             
             <div class="message-bubble large">
               <p>{{ msg.text }}</p>
               <span class="sender-label">{{ msg.sender === 'user' ? 'YOU' : 'ELECTREGY AI' }}</span>
             </div>
        </div>

        <!-- Loading Indicator for Fullscreen Chat -->
        <div *ngIf="isBotTyping" class="message-row bot-row">
           <div class="message-bubble large typing-indicator">
              <div class="typing-dots">
                <span></span><span></span><span></span>
              </div>
           </div>
        </div>

      </div>
    </div>

    <div class="fs-footer">
       <div class="input-wrapper">
        <input [(ngModel)]="userInput" 
               (keydown.enter)="send()" 
               placeholder="Message Electregy AI...">
        <button class="send-btn-full" (click)="send()">
          Send
        </button>
      </div>
    </div>
  </div>
</div>
